<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Solute–Solvent Interactions | Interactive Teaching Lab</title>
<style>
:root{
  --bg:#f4f9fb;
  --bg-raise:#ffffff;
  --bg-raise-2:#eef6fa;
  --line:#c9dce6;
  --line-soft:#d8e8ef;
  --text:#152733;
  --text-dim:#3f5c6c;
  --text-faint:#7896a4;
  --solvent:#0d84d1;      /* A = solvent */
  --solvent-dim:#dbf0fc;
  --solvent-glow: rgba(13,132,209,0.28);
  --solute:#e8720c;       /* B = solute */
  --solute-dim:#ffe6cc;
  --solute-glow: rgba(232,114,12,0.28);
  --good:#158a4a;
  --good-dim:#d8f6e4;
  --bad:#d13438;
  --bad-dim:#fde1e1;
  --teacher:#7b2fd6;
  --teacher-dim:#f0e4fc;
  --radius:16px;
  --radius-sm:10px;
  --font-display:'Space Grotesk','Segoe UI',system-ui,-apple-system,sans-serif;
  --font-body:'IBM Plex Sans','Segoe UI',system-ui,-apple-system,sans-serif;
  --font-mono:'IBM Plex Mono','Consolas',monospace;
  --touch:60px;
}
*{box-sizing:border-box;}
html{font-size:20px;}
html,body{height:100%;}
body{
  margin:0;
  background:
    radial-gradient(ellipse at 20% 10%, #dbeeff 0%, transparent 55%),
    radial-gradient(ellipse at 85% 90%, #ffe9d2 0%, transparent 55%),
    #c9dbe6;
  font-family:var(--font-body);
  min-height:100vh;
  overflow:hidden;
}
#frameOuter{
  width:100vw; height:100vh;
  position:relative;
  overflow:hidden;
}
#frame{
  width:1920px; height:1080px;
  position:absolute; top:0; left:0;
  background:
    radial-gradient(ellipse at 12% -10%, #e4f4fd 0%, transparent 55%),
    radial-gradient(ellipse at 100% 110%, #fff3e2 0%, transparent 50%),
    var(--bg);
  color:var(--text);
  border-radius:22px;
  overflow:hidden;
  box-shadow:0 30px 80px rgba(15,45,70,0.35), 0 0 0 10px #0e1c26;
  display:flex;
  flex-direction:column;
  transform-origin:top left;
}
button{font-family:inherit;}
:focus-visible{
  outline:3px solid var(--solvent);
  outline-offset:2px;
  border-radius:6px;
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;}
}

/* ===== Header ===== */
header.topbar{
  display:flex;
  align-items:center;
  gap:22px;
  padding:14px 30px;
  background:rgba(255,255,255,0.92);
  border-bottom:2px solid var(--line);
  flex:none;
  z-index:40;
  backdrop-filter:blur(6px);
  box-shadow:0 2px 14px rgba(20,60,90,0.06);
}
.brand{
  display:flex;
  flex-direction:column;
  line-height:1.15;
  min-width:0;
}
.brand .eyebrow{
  font-family:var(--font-mono);
  font-size:18px;
  color:var(--text-dim);
  letter-spacing:.14em;
  text-transform:uppercase;
}
.brand h1{
  font-family:var(--font-display);
  font-size:34px;
  margin:2px 0 0;
  font-weight:700;
  color:var(--text);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.progress-dots{
  display:flex;
  align-items:center;
  gap:9px;
  flex:1;
  overflow-x:auto;
  padding:4px 0;
}
.dot{
  width:14px;height:14px;border-radius:50%;
  background:var(--bg-raise-2);
  border:2px solid var(--line);
  flex:none;
  cursor:default;
  transition:transform .2s, background .2s, border-color .2s;
}
.dot.done{background:var(--good); border-color:var(--good);}
.dot.active{background:var(--solvent); border-color:var(--solvent); transform:scale(1.5); box-shadow:0 0 0 4px var(--solvent-glow);}
.dot.jumpable{cursor:pointer;}
.dot.jumpable:hover{transform:scale(1.3);}
.teacher-toggle{
  flex:none;
  display:flex;
  align-items:center;
  gap:8px;
  padding:9px 16px;
  min-height:var(--touch);
  border-radius:999px;
  border:2px solid var(--line);
  background:var(--bg-raise-2);
  color:var(--text-dim);
  font-family:var(--font-mono);
  font-size:13px;
  letter-spacing:.06em;
  text-transform:uppercase;
  cursor:pointer;
  transition:all .2s;
}
.teacher-toggle .led{width:9px;height:9px;border-radius:50%;background:var(--text-faint);transition:all .2s;}
.teacher-toggle.on{border-color:var(--teacher); color:var(--teacher); background:var(--teacher-dim);}
.teacher-toggle.on .led{background:var(--teacher); box-shadow:0 0 8px var(--teacher);}
.teacher-toggle:hover{border-color:var(--teacher);}

/* ===== Main stage ===== */
main#stage{
  flex:1;
  width:100%;
  max-width:1500px;
  margin:0 auto;
  padding:30px 52px 96px;
  display:flex;
  flex-direction:column;
  gap:26px;
  overflow-y:auto;
  scrollbar-width:thin;
}
main#stage.screen-enter{animation:stageIn .5s cubic-bezier(.2,.7,.3,1);}
@keyframes stageIn{
  from{opacity:0; transform:translateY(22px);}
  to{opacity:1; transform:translateY(0);}
}
.screen-kicker{
  font-family:var(--font-mono);
  font-size:23px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--solvent);
  font-weight:700;
}
.screen-title{
  font-family:var(--font-display);
  font-size:70px;
  font-weight:700;
  margin:0;
  line-height:1.08;
  color:var(--text);
}
.screen-sub{
  font-size:30px;
  color:var(--text-dim);
  max-width:78ch;
  margin:0;
}
.panel{
  background:var(--bg-raise);
  border:2px solid var(--line);
  border-radius:var(--radius);
  padding:36px;
  box-shadow:0 4px 20px rgba(20,60,90,0.05);
}
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:28px;}
@media (max-width:840px){.grid-2{grid-template-columns:1fr;}}

.btn{
  min-height:var(--touch);
  padding:16px 28px;
  border-radius:var(--radius-sm);
  border:2.5px solid var(--line);
  background:var(--bg-raise-2);
  color:var(--text);
  font-size:27px;
  font-weight:700;
  cursor:pointer;
  transition:transform .12s, border-color .15s, background .15s, box-shadow .15s;
  touch-action:manipulation;
}
.btn:hover{border-color:var(--solvent); background:#e2f2fc;}
.btn:active{transform:scale(0.97);}
.btn.primary{background:var(--solvent); border-color:var(--solvent); color:#ffffff;}
.btn.primary:hover{background:#0b6fae;}
.btn.solute{background:var(--solute); border-color:var(--solute); color:#ffffff;}
.btn.solute:hover{background:#c05f09;}
.btn.ghost{background:transparent;}
.btn.big{min-height:86px; font-size:31px; padding:22px 38px;}
.btn.correct{background:var(--good); border-color:var(--good); color:#ffffff;}
.btn.wrong{background:var(--bad); border-color:var(--bad); color:#ffffff;}
.btn:disabled{opacity:.55; cursor:default;}
.btn-row{display:flex; flex-wrap:wrap; gap:14px;}

.feedback{
  border-radius:var(--radius-sm);
  padding:22px 28px;
  font-size:27px;
  border:2px solid var(--line);
  display:none;
  align-items:flex-start;
  gap:10px;
}
.feedback.show{display:flex;}
.feedback.good{background:var(--good-dim); border-color:var(--good); color:#0d4a29;}
.feedback.bad{background:var(--bad-dim); border-color:var(--bad); color:#7a1518;}
.feedback b{font-family:var(--font-display);}

/* legend / molecule labels */
.legend{display:flex; gap:30px; flex-wrap:wrap; font-family:var(--font-mono); font-size:19px; color:var(--text-dim); font-weight:700;}
.legend span{display:inline-flex; align-items:center; gap:8px;}
.swatch{width:24px;height:24px;border-radius:50%;display:inline-block;}
.swatch.a{background:var(--solvent); box-shadow:0 0 8px var(--solvent-glow);}
.swatch.b{background:var(--solute); box-shadow:0 0 8px var(--solute-glow);}

/* beaker (screen 1) */
.beakers{display:flex; gap:56px; justify-content:center; align-items:flex-end; flex-wrap:wrap; padding:20px 0;}
.beaker-wrap{text-align:center;}
.beaker{
  width:190px; height:240px;
  border:5px solid #587a91;
  border-top:none;
  border-radius:0 0 16px 16px;
  position:relative;
  overflow:hidden;
  background:#eaf6fc;
  margin:0 auto;
  box-shadow:inset 0 0 20px rgba(13,132,209,0.08);
}
.beaker::before{
  content:"";
  position:absolute; left:-9px; right:-9px; top:-5px; height:5px;
  background:#587a91;
}
.liquid{position:absolute; left:0; right:0; bottom:0; height:65%; transition:all 1.2s ease;}
.liquid.water{background:linear-gradient(180deg, #6fd1f5, #1596d6);}
.granule{position:absolute; width:7px; height:7px; background:#ffffff; border:1px solid #0d84d1; border-radius:2px; transition:all 1.4s ease;}
.oildrop{position:absolute; border-radius:50%; background:radial-gradient(circle at 35% 30%, #ffcf7e, #e8720c); transition:all 1.4s ease;}
.beaker-label{font-family:var(--font-mono); font-size:19px; color:var(--text-dim); margin-top:12px; letter-spacing:.04em; font-weight:700;}

/* sortable / matching cards */
.card-tray{display:flex; flex-wrap:wrap; gap:14px;}
.chip{
  min-height:var(--touch);
  padding:16px 26px;
  border-radius:999px;
  border:2.5px solid var(--line);
  background:var(--bg-raise-2);
  color:var(--text);
  font-weight:700;
  cursor:pointer;
  transition:all .15s;
  font-size:28px;
}
.chip[aria-pressed="true"]{border-color:var(--solvent); background:var(--solvent-dim); box-shadow:0 0 0 3px var(--solvent-glow); transform:translateY(-2px);}
.chip.placed-correct{background:var(--good-dim); border-color:var(--good); color:#0d4a29; opacity:.9; cursor:default;}
.chip.placed-wrong-shake{animation:shake .4s;}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}
.zones{display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-top:18px;}
@media (max-width:700px){.zones{grid-template-columns:1fr;}}
.zone{
  min-height:150px;
  border:3px dashed var(--line);
  border-radius:var(--radius);
  padding:18px;
  transition:all .15s;
}
.zone h3{margin:0 0 14px; font-family:var(--font-display); font-size:30px;}
.zone.zone-a{background:rgba(13,132,209,0.05);}
.zone.zone-b{background:rgba(232,114,12,0.05);}
.zone.zone-a h3{color:var(--solvent);}
.zone.zone-b h3{color:var(--solute);}
.zone.receivable{border-color:var(--text-dim);}
.zone .placed-list{display:flex; flex-wrap:wrap; gap:8px;}

/* molecule stage (SVG) */
.stage-wrap{background:#eef8fd; border:2px solid var(--line-soft); border-radius:var(--radius); padding:10px;}
.mol{transition:transform 1s cubic-bezier(.4,0,.2,1);}
.bond-line{stroke-dasharray:6 5; transition:opacity .5s;}
.mol-label{font-family:var(--font-mono); font-size:30px; font-weight:700; fill:var(--text-dim);}

.case-nav{display:flex; gap:10px; margin-bottom:8px; flex-wrap:wrap;}
.case-pill{
  font-family:var(--font-mono); font-size:18px; font-weight:700; padding:10px 20px; border-radius:999px;
  border:2px solid var(--line); color:var(--text-dim);
}
.case-pill.active{border-color:var(--teacher); color:var(--teacher); background:var(--teacher-dim);}
.case-pill.done{border-color:var(--good); color:var(--good); background:var(--good-dim);}

/* quiz */
.quiz-progress{font-family:var(--font-mono); font-size:19px; color:var(--text-dim); font-weight:700;}
.score-badge{
  font-family:var(--font-display); font-size:28px; font-weight:700;
  background:var(--solvent-dim); color:var(--solvent); border:2px solid var(--solvent); border-radius:999px;
  padding:6px 20px; display:inline-block;
}

/* concept map */
.flow{display:flex; flex-direction:column; align-items:center; gap:8px; margin:14px 0;}
.flow-node{
  background:var(--solvent-dim); border:3px solid var(--solvent); border-radius:var(--radius-sm);
  padding:22px 38px; font-family:var(--font-display); font-weight:700; font-size:34px;
  text-align:center; color:#0a4a70;
}
.flow-arrow{color:var(--text-faint); font-size:34px; line-height:1;}
.takeaway{
  text-align:center; font-family:var(--font-display); font-size:76px;
  color:var(--solvent); margin:10px 0 0; letter-spacing:.02em; font-weight:700;
}
.takeaway-sub{text-align:center; color:var(--text-dim); font-size:29px;}

/* footer nav (student, minimal) */
.continue-row{display:flex; justify-content:flex-end; margin-top:6px;}

/* teacher toolbar */
.teacher-bar{
  position:absolute; left:0; right:0; bottom:0; z-index:50;
  background:rgba(255,255,255,0.97);
  border-top:2px solid var(--teacher);
  backdrop-filter:blur(8px);
  padding:10px 26px;
  display:none;
  gap:10px;
  flex-wrap:wrap;
  align-items:center;
  box-shadow:0 -4px 18px rgba(80,20,140,0.08);
}
.teacher-bar.show{display:flex;}
.teacher-bar .tlabel{
  font-family:var(--font-mono); font-size:12px; color:var(--teacher); text-transform:uppercase;
  letter-spacing:.1em; margin-right:6px; font-weight:700;
}
.tbtn{
  min-height:46px; padding:9px 15px; border-radius:8px; border:2px solid var(--teacher-dim);
  background:var(--teacher-dim); color:#4a1a8c; font-size:14px; font-weight:700; cursor:pointer; font-family:var(--font-mono);
}
.tbtn:hover{border-color:var(--teacher);}
.tselect{
  min-height:46px; border-radius:8px; border:2px solid var(--teacher-dim); background:var(--teacher-dim);
  color:#4a1a8c; font-family:var(--font-mono); font-size:14px; font-weight:700; padding:6px 10px;
}
.discussion-pop{
  position:absolute; right:20px; bottom:76px; z-index:60;
  background:#ffffff; border:2px solid var(--teacher); border-radius:var(--radius);
  padding:18px 22px; max-width:360px; display:none; box-shadow:0 10px 40px rgba(60,20,100,.18);
}
.discussion-pop.show{display:block;}
.discussion-pop h4{margin:0 0 10px; font-family:var(--font-display); color:var(--teacher); font-size:17px;}
.discussion-pop ul{margin:0; padding-left:18px; color:var(--text); font-size:15px; line-height:1.7;}

.hidden{display:none !important;}
.mt{margin-top:16px;}
.sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap;}

/* ===== animation flourishes ===== */
@keyframes moleculeFloat{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-6px);}
}
.mol-idle{animation:moleculeFloat 3.2s ease-in-out infinite;}
.stage-svg-anim{transition:opacity .45s ease, transform .45s ease;}
.stage-svg-anim.stage-hidden{opacity:0; transform:scale(0.94);}
.bond-line{opacity:0; transition:opacity .6s ease .15s;}
.bond-line.bond-visible{opacity:1;}

@keyframes dotPulse{
  0%,100%{box-shadow:0 0 0 4px var(--solvent-glow);}
  50%{box-shadow:0 0 0 9px var(--solvent-glow);}
}
.dot.active{animation:dotPulse 1.8s ease-in-out infinite;}

.btn{transform:translateY(0);}
.btn:hover{transform:translateY(-3px); box-shadow:0 6px 16px rgba(20,60,90,0.12);}
.btn:active{transform:translateY(0) scale(0.97); box-shadow:none;}

@keyframes feedbackPop{
  0%{transform:scale(0.92); opacity:0;}
  60%{transform:scale(1.02); opacity:1;}
  100%{transform:scale(1);}
}
.feedback.show{animation:feedbackPop .4s cubic-bezier(.3,1.4,.4,1);}

.chip{transition:all .2s cubic-bezier(.3,1.2,.4,1);}
@keyframes chipCorrectPop{
  0%{transform:scale(1);}
  40%{transform:scale(1.08);}
  100%{transform:scale(1);}
}
.chip.placed-correct{animation:chipCorrectPop .45s ease;}

@keyframes flowIn{
  from{opacity:0; transform:translateY(18px);}
  to{opacity:1; transform:translateY(0);}
}
.flow-node{opacity:0; animation:flowIn .55s ease forwards;}
.flow-arrow{opacity:0; animation:flowIn .5s ease forwards;}
@keyframes takeawayIn{
  0%{opacity:0; transform:scale(0.85);}
  70%{opacity:1; transform:scale(1.04);}
  100%{transform:scale(1);}
}
.takeaway{animation:takeawayIn .7s cubic-bezier(.3,1.3,.4,1) forwards; opacity:0;}
.takeaway-sub{opacity:0; animation:flowIn .6s ease forwards;}

@keyframes granuleDrift{
  0%,100%{transform:translate(0,0);}
  50%{transform:translate(1px,-1px);}
}
.granule{animation:granuleDrift 2.6s ease-in-out infinite;}
@keyframes oilBob{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-3px);}
}
.oildrop{animation:oilBob 3s ease-in-out infinite;}

@keyframes shakeX{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}
.btn.wrong{animation:shakeX .4s ease;}

</style>
</head>
<body>
<div id="frameOuter">
<div id="frame">

<header class="topbar">
  <div class="brand">
    <span class="eyebrow">Physical Pharmaceutics I &middot; Unit 2</span>
    <h1 id="brandTitle">Solute–Solvent Interactions</h1>
  </div>
  <div class="progress-dots" id="progressDots" role="img" aria-label="Module progress"></div>
  <button class="teacher-toggle" id="teacherToggle" aria-pressed="false">
    <span class="led"></span> Teacher Mode
  </button>
</header>

<main id="stage" tabindex="-1"></main>

<div class="teacher-bar" id="teacherBar">
  <span class="tlabel">Teacher controls</span>
  <button class="tbtn" id="tPrev">&larr; Previous</button>
  <button class="tbtn" id="tNext">Next &rarr;</button>
  <button class="tbtn" id="tRestartActivity">Restart Activity</button>
  <button class="tbtn" id="tShowAnswer">Show Answer</button>
  <button class="tbtn" id="tResetQuestion">Reset Question</button>
  <select class="tselect" id="tJump"></select>
  <button class="tbtn" id="tDiscussion">Reveal Discussion Prompts</button>
</div>

<div class="discussion-pop" id="discussionPop">
  <h4>Discussion prompts</h4>
  <ul id="discussionList"></ul>
</div>

</div>
</div>

<script>
(function(){

"use strict";

/* ===================== STATE ===================== */
const SCREEN_TITLES = [
  "The Dissolving Question","Like Dissolves Like","Solute–Solvent Matching",
  "Molecular Interaction Lab","Who Wins?","Hydrogen Bonding",
  "Predict Before You Reveal","Pharmaceutical Application","Rapid-Fire Quiz","Concept Map"
];
const state = { screen:0, teacherMode:false, completed:new Array(10).fill(false) };
let currentHooks = { restart:null, showAnswer:null, resetQuestion:null, discussion:[] };

const stage = document.getElementById('stage');
const dotsWrap = document.getElementById('progressDots');
const teacherBar = document.getElementById('teacherBar');
const teacherToggle = document.getElementById('teacherToggle');
const discussionPop = document.getElementById('discussionPop');
const discussionList = document.getElementById('discussionList');
const tJump = document.getElementById('tJump');

function el(tag, attrs, ...children){
  const n = document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k === 'class') n.className = attrs[k];
    else if(k === 'html') n.innerHTML = attrs[k];
    else if(k.startsWith('on')) n.addEventListener(k.slice(2), attrs[k]);
    else n.setAttribute(k, attrs[k]);
  }
  children.flat().forEach(c=>{
    if(c===null||c===undefined) return;
    n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return n;
}

function markComplete(i){ state.completed[i] = true; renderDots(); }

function renderDots(){
  dotsWrap.innerHTML = '';
  SCREEN_TITLES.forEach((t,i)=>{
    const d = el('span', {
      class:'dot' + (i===state.screen?' active':'') + (state.completed[i]?' done':'') + (state.teacherMode?' jumpable':''),
      title:(i+1)+'. '+t,
      role:'button',
      tabindex: state.teacherMode ? 0 : -1,
      'aria-label':'Screen '+(i+1)+': '+t
    });
    if(state.teacherMode){
      d.addEventListener('click', ()=>goTo(i));
      d.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' ') goTo(i); });
    }
    dotsWrap.appendChild(d);
  });
}

function goTo(i){
  if(i<0||i>SCREEN_TITLES.length-1) return;
  state.screen = i;
  renderScreen();
}
function goNext(){ if(state.screen < SCREEN_TITLES.length-1) goTo(state.screen+1); }
function goPrev(){ if(state.screen > 0) goTo(state.screen-1); }

teacherToggle.addEventListener('click', ()=>{
  state.teacherMode = !state.teacherMode;
  teacherToggle.classList.toggle('on', state.teacherMode);
  teacherToggle.setAttribute('aria-pressed', state.teacherMode);
  teacherBar.classList.toggle('show', state.teacherMode);
  if(!state.teacherMode) discussionPop.classList.remove('show');
  renderDots();
});
document.getElementById('tPrev').addEventListener('click', goPrev);
document.getElementById('tNext').addEventListener('click', goNext);
document.getElementById('tRestartActivity').addEventListener('click', ()=>{ if(currentHooks.restart) currentHooks.restart(); });
document.getElementById('tShowAnswer').addEventListener('click', ()=>{ if(currentHooks.showAnswer) currentHooks.showAnswer(); });
document.getElementById('tResetQuestion').addEventListener('click', ()=>{ if(currentHooks.resetQuestion) currentHooks.resetQuestion(); });
document.getElementById('tDiscussion').addEventListener('click', ()=>{
  discussionList.innerHTML='';
  (currentHooks.discussion.length? currentHooks.discussion : ['Why did you choose this answer?']).forEach(p=>{
    discussionList.appendChild(el('li',null,p));
  });

/* ---- reusable molecule stage (SVG) ---- */
function moleculeStage(mode, opts){
  opts = opts || {};
  const w=700,h=320;
  const aCount = opts.aCount||5, bCount = opts.bCount||5;
  const svgNS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(svgNS,'svg');
  svg.setAttribute('viewBox','0 0 '+w+' '+h);
  svg.setAttribute('width','100%');
  svg.setAttribute('height', opts.height||'380');
  svg.setAttribute('role','img');
  svg.setAttribute('aria-label', opts.ariaLabel || describeMode(mode));

  function ring(cx,cy,n,r){
    const pts=[];
    for(let k=0;k<n;k++){
      const ang = (k/n)*Math.PI*2;
      pts.push([cx+Math.cos(ang)*r, cy+Math.sin(ang)*r]);
    }
    return pts;
  }

  let aPos, bPos, bonds=[];
  if(mode==='separated'){
    aPos = ring(180,160,aCount,74);
    bPos = ring(520,160,bCount,74);
  } else if(mode==='AA'){
    aPos = ring(180,160,aCount,52);
    bPos = ring(560,225,bCount,62);
    for(let i=0;i<aCount;i++) for(let j=i+1;j<aCount;j++) bonds.push([aPos[i],aPos[j],'a']);
  } else if(mode==='BB'){
    bPos = ring(520,160,bCount,52);
    aPos = ring(140,225,aCount,62);
    for(let i=0;i<bCount;i++) for(let j=i+1;j<bCount;j++) bonds.push([bPos[i],bPos[j],'b']);
  } else if(mode==='AB'){
    const n = Math.max(aCount,bCount);
    aPos=[]; bPos=[];
    const centerPts = ring(350,160,n,86);
    for(let i=0;i<aCount;i++){ const p=centerPts[i%n]; aPos.push([p[0]-32, p[1]-18]); }
    for(let i=0;i<bCount;i++){ const p=centerPts[i%n]; bPos.push([p[0]+32, p[1]+18]); }
    for(let i=0;i<Math.min(aCount,bCount);i++) bonds.push([aPos[i],bPos[i],'ab']);
  }

  bonds.forEach(([p1,p2,kind])=>{
    const line = document.createElementNS(svgNS,'line');
    line.setAttribute('x1',p1[0]); line.setAttribute('y1',p1[1]);
    line.setAttribute('x2',p2[0]); line.setAttribute('y2',p2[1]);
    line.setAttribute('class','bond-line');
    line.setAttribute('stroke', kind==='ab' ? '#c2186e' : (kind==='a'?'#0d84d1':'#e8720c'));
    line.setAttribute('stroke-width', kind==='ab'?5:4);
    svg.appendChild(line);
  });

  function drawMolecules(positions, color, label, dim){
    positions.forEach((p,idx)=>{
      const g = document.createElementNS(svgNS,'g');
      g.setAttribute('class', dim ? 'mol' : 'mol mol-idle');
      g.style.animationDelay = (idx*0.18)+'s';
      g.style.transformBox = 'fill-box';
      g.style.transformOrigin = 'center';
      const c = document.createElementNS(svgNS,'circle');
      c.setAttribute('cx',p[0]); c.setAttribute('cy',p[1]); c.setAttribute('r', 32);
      c.setAttribute('fill', color);
      c.setAttribute('opacity', dim?0.28:0.92);
      c.setAttribute('stroke', '#1a3242'); c.setAttribute('stroke-width','3');
      g.appendChild(c);
      const t = document.createElementNS(svgNS,'text');
      t.setAttribute('x',p[0]); t.setAttribute('y',p[1]+5);
      t.setAttribute('text-anchor','middle');
      t.setAttribute('class','mol-label');
      t.setAttribute('fill', dim?'#8aa0ad':'#ffffff');
      t.setAttribute('font-weight','700');
      t.textContent = label;
      g.appendChild(t);
      svg.appendChild(g);
    });
  }
  const dimA = mode==='BB';
  const dimB = mode==='AA';
  drawMolecules(aPos, '#0d84d1', 'A', dimA);
  drawMolecules(bPos, '#e8720c', 'B', dimB);
  requestAnimationFrame(()=>{
    svg.querySelectorAll('.bond-line').forEach(l=>l.classList.add('bond-visible'));
  });
  return svg;
}
function describeMode(mode){
  return {separated:'Solvent and solute molecules shown separately, not yet interacting.',
    AA:'Solvent molecules clustered tightly together: A to A interaction.',
    BB:'Solute molecules clustered tightly together: B to B interaction.',
    AB:'Solvent and solute molecules paired together: A to B interaction.'}[mode] || '';
}
/* cross-fades the stage's content to a new SVG for a clearer sense of transition */
function swapStage(stageWrap, newSvg){
  newSvg.classList.add('stage-svg-anim','stage-hidden');
  const old = stageWrap.firstElementChild;
  if(old){
    old.classList.add('stage-svg-anim','stage-hidden');
    setTimeout(()=>{ stageWrap.innerHTML=''; stageWrap.appendChild(newSvg);
      requestAnimationFrame(()=>newSvg.classList.remove('stage-hidden'));
    }, 260);
  } else {
    stageWrap.appendChild(newSvg);
    requestAnimationFrame(()=>newSvg.classList.remove('stage-hidden'));
  }
}

      const t=document.createElementNS(svgNS,'text'); t.setAttribute('x',x); t.setAttribute('y',y+8);
      t.setAttribute('text-anchor','middle'); t.setAttribute('font-weight','700'); t.setAttribute('fill','#ffffff'); t.setAttribute('font-size','23');
      t.textContent=label; g.appendChild(t);
      return g;
    }
    const molA = mkMol(100,110,'#0d84d1', leftLabel);
    const molB = mkMol(300,110,'#e8720c', 'H\u2082O');
    svg.appendChild(molA); svg.appendChild(molB);
    const bond = document.createElementNS(svgNS,'line');
    bond.setAttribute('x1',148); bond.setAttribute('y1',110); bond.setAttribute('x2',252); bond.setAttribute('y2',110);
    bond.setAttribute('stroke','#c2186e'); bond.setAttribute('stroke-width','6'); bond.setAttribute('stroke-dasharray','8 6');
    bond.style.opacity='0';
    svg.appendChild(bond);
    wrap.appendChild(svg);
    p.appendChild(wrap);
    const explain = el('div',{class:'panel mt', style:'display:none; border-color:var(--solvent);'});
    p.appendChild(explain);
    const btn = el('button',{class:'btn primary big mt'}, buttonLabel);
    p.appendChild(btn);

    let done=false;
    function animate(){
      if(done) return; done=true;
      molA.setAttribute('transform','translate(48,0)');
      molB.setAttribute('transform','translate(-48,0)');
      setTimeout(()=>{ bond.style.opacity='1'; },500);
      explain.style.display='block';
      explain.innerHTML = '<p style="margin:0; color:var(--text-dim);">'+resultText+'</p>';
      markSubDone();
    }
    btn.addEventListener('click', animate);
    return { el:p, animate, reset(){ done=false; molA.removeAttribute('transform'); molB.removeAttribute('transform'); bond.style.opacity='0'; explain.style.display='none'; } };
  }

  const p1 = pairPanel('Ammonia + Water','NH\u2083','MIX','Favorable hydrogen-bonding interactions promote mixing between ammonia and water.');
  const p2 = pairPanel('Alcohol + Water','R\u2013OH','SHOW INTERACTION','The polar \u2013OH group can form hydrogen bonds with water, promoting mixing.');
  grid.appendChild(p1.el); grid.appendChild(p2.el);
  container.appendChild(grid);

  let subDone=0;
  function markSubDone(){
    subDone++;
    if(subDone===2 && !container.querySelector('.continue-row')){
      const {row} = continueBtn('Continue to Predict Before You Reveal \u2192', ()=>goNext());
      container.appendChild(row);
      markComplete(5);
    }
  }

  return { restart(){ renderScreen(); },
    showAnswer(){ p1.animate(); p2.animate(); },
    resetQuestion(){ p1.reset(); p2.reset(); subDone=0; const r=container.querySelector('.continue-row'); if(r) r.remove(); },
    discussion:['What new interaction is formed here?','Why does the \u2013OH group matter for water miscibility?'] };
}

/* ---- Screen 6: Predict before reveal ---- */
function buildScreen6(container){
  container.appendChild(screenHeader('Screen 7 \u00b7 Predict Before You Reveal','Make a prediction, then check the explanation',
    'Work through all three examples.'));

  const examples = [
    { title:'Naphthalene + Water', q:'Will naphthalene dissolve readily in water?', options:['YES','NO'], answer:'NO',
      explain:'Naphthalene is non-polar; water is polar. Unlike substances do not interact favorably, so naphthalene does not dissolve readily in water.' },
    { title:'Naphthalene + Benzene', q:'Will naphthalene dissolve readily in benzene?', options:['YES','NO'], answer:'YES',
      explain:'Naphthalene and benzene are both non-polar, so they share similar chemical character and interact favorably.' },
    { title:'Ammonia + Water', q:'What interaction helps ammonia mix with water?', options:['Hydrogen bonding','Metallic bonding','No interaction','Ionic bonding'], answer:'Hydrogen bonding',
      explain:'Ammonia and water both participate in hydrogen bonding, which favors mixing.' }
  ];
  const panel = el('div',{class:'panel'});
  const caseNav = el('div',{class:'case-nav'});
  const pills = examples.map((c,i)=>el('span',{class:'case-pill'+(i===0?' active':'')}, 'Example '+(i+1)));
  pills.forEach(p=>caseNav.appendChild(p));
  panel.appendChild(caseNav);
  const title = el('h3',{style:'font-family:var(--font-display); margin:6px 0; font-size:36px;'});
  panel.appendChild(title);
  const q = el('p',{class:'screen-sub', style:'color:var(--text); font-size:17px;'});
  panel.appendChild(q);
  const optRow = el('div',{class:'btn-row'});
  panel.appendChild(optRow);
  const fb = feedbackBox();
  panel.appendChild(fb);
  container.appendChild(panel);

  let idx=0, answered=false;
  function renderEx(){
    pills.forEach((p,i)=>{ p.className='case-pill'+(i===idx?' active':'')+(i<idx?' done':''); });
    const c = examples[idx];
    title.textContent = c.title;
    q.textContent = c.q;
    optRow.innerHTML=''; fb.className='feedback'; answered=false;
    c.options.forEach(opt=>{
      const b = el('button',{class:'btn big'}, opt);
      b.addEventListener('click',()=>{
        if(answered) return; answered=true;
        const correct = opt===c.answer;
        showFeedback(fb, correct, '<b>'+(correct?'Correct.':'Not quite.')+'</b> '+c.explain);
        [...optRow.children].forEach(btn=>{ btn.disabled=true; if(btn.textContent===c.answer) btn.classList.add('correct'); else if(btn===b) btn.classList.add('wrong'); });
        const nextRow = el('div',{class:'continue-row mt'});
        const label = idx<examples.length-1 ? 'Next Example \u2192' : 'Continue to Pharmaceutical Application \u2192';
        nextRow.appendChild(el('button',{class:'btn primary big', onclick:()=>{
          nextRow.remove();
          if(idx<examples.length-1){ idx++; renderEx(); } else { markComplete(6); goNext(); }
        }}, label));
        panel.appendChild(nextRow);
      });
      optRow.appendChild(b);
    });
  }
  renderEx();
  return { restart(){ renderScreen(); },
    showAnswer(){ if(answered) return; const c=examples[idx]; [...optRow.children].forEach(btn=>{btn.disabled=true; if(btn.textContent===c.answer) btn.classList.add('correct');}); showFeedback(fb,true,'<b>Answer:</b> '+c.explain); answered=true; },
    resetQuestion(){ renderEx(); },
    discussion:['Why did you choose this answer?','Can you explain this using "like dissolves like"?'] };
}

/* ---- Screen 7: Pharma application ---- */
function buildScreen7(container){
  container.appendChild(screenHeader('Screen 8 \u00b7 Pharmaceutical Application','Reason like a formulator',
    'A drug shows poor solubility in water. What should you investigate first?'));

  const panel = el('div',{class:'panel'});
  const options = ['Its packaging colour','Its chemical nature and polarity','Its market price','Its tablet shape'];
  const answer = 'Its chemical nature and polarity';
  const optRow = el('div',{class:'btn-row'});
  const fb = feedbackBox();
  const chain = el('div',{class:'panel mt', style:'display:none; border-color:var(--solvent);'});
  const steps = ['Chemical nature','Polarity','Intermolecular interactions','Solute\u2013solvent compatibility','Solubility'];
  const flow = el('div',{class:'flow'});
  steps.forEach((s,i)=>{
    const node = el('div',{class:'flow-node', style:'animation-delay:'+(i*0.12)+'s;'}, s);
    flow.appendChild(node);
    if(i<steps.length-1) flow.appendChild(el('div',{class:'flow-arrow', style:'animation-delay:'+(i*0.12+0.06)+'s;'}, '\u2193'));
  });
  chain.appendChild(el('p',{style:'margin:0 0 4px; color:var(--text-dim);'},'A formulator reasons through this chain to understand why a drug is poorly soluble:'));
  chain.appendChild(flow);

  options.forEach(opt=>{
    const b = el('button',{class:'btn big'}, opt);
    b.addEventListener('click',()=>{
      const correct = opt===answer;
      [...optRow.children].forEach(btn=>btn.disabled=true);
      if(correct) b.classList.add('correct'); else b.classList.add('wrong');
      showFeedback(fb, correct, correct
        ? '<b>Correct.</b> Investigating chemical nature and polarity is the first step toward understanding solute\u2013solvent compatibility.'
        : '<b>Think again.</b> Focus on what governs molecular interactions between drug and solvent.');
      if(correct){
        chain.style.display='block';
        markComplete(7);
        const {row} = continueBtn('Continue to the Rapid-Fire Quiz \u2192', ()=>goNext());
        panel.appendChild(row);
      } else {
        setTimeout(()=>{ [...optRow.children].forEach(btn=>{ btn.disabled=false; btn.classList.remove('wrong'); }); fb.className='feedback'; },1200);
      }
    });
    optRow.appendChild(b);
  });

  panel.appendChild(optRow);
  panel.appendChild(fb);
  panel.appendChild(chain);
  container.appendChild(panel);

  return { restart(){ renderScreen(); },
    showAnswer(){
      [...optRow.children].forEach(btn=>{ btn.disabled=true; if(btn.textContent===answer) btn.classList.add('correct'); });
      chain.style.display='block';
      showFeedback(fb,true,'<b>Answer:</b> Chemical nature and polarity, leading through the full reasoning chain to solubility.');
    },
    resetQuestion(){ renderScreen(); },
    discussion:['Why does polarity matter for pre-formulation?','What would you check next if A\u2013B interactions were unfavorable?'] };
}

/* ---- Screen 8: Quiz ---- */
function buildScreen8(container){
  container.appendChild(screenHeader('Screen 9 \u00b7 Rapid-Fire Quiz','Test your understanding',''));

  const questions = [
    { q:'What does "like dissolves like" mean?', options:['Only ionic substances dissolve','Substances of similar polarity interact favorably','All substances dissolve in water','Temperature determines solubility'],
      answer:1, explain:'Substances with similar polarity form more favorable interactions with each other.' },
    { q:'What does A\u2013B represent?', options:['Solvent\u2013solvent interaction','Solute\u2013solute interaction','Solute\u2013solvent interaction','No interaction'],
      answer:2, explain:'A is the solvent and B is the solute, so A\u2013B is the solute\u2013solvent interaction.' },
    { q:'Which interaction represents solvent\u2013solvent attraction?', options:['A\u2013A','B\u2013B','A\u2013B','B\u2013A'],
      answer:0, explain:'A\u2013A is solvent interacting with solvent.' },
    { q:'Why does alcohol interact favorably with water?', options:['Both are non-polar','The \u2013OH group forms hydrogen bonds with water','Alcohol is denser than water','They have the same boiling point'],
      answer:1, explain:'The polar \u2013OH group in alcohol hydrogen-bonds with water.' },
    { q:'Why is naphthalene more compatible with a non-polar solvent?', options:['It is ionic','It shares similar non-polar character','It reacts chemically with the solvent','It has no polarity at all times'],
      answer:1, explain:'Naphthalene is non-polar, matching the character of non-polar solvents like benzene.' },
    { q:'What happens when solute\u2013solvent interactions are sufficiently favorable?', options:['Poor dissolution','Precipitation only','Solution formation / improved dissolution','No change occurs'],
      answer:2, explain:'Favorable A\u2013B interactions promote solution formation.' }
  ];
  let idx=0, score=0, answered=false;

  const panel = el('div',{class:'panel'});
  const top = el('div',{class:'btn-row', style:'justify-content:space-between; align-items:center;'});
  const progress = el('span',{class:'quiz-progress'});
  const scoreBadge = el('span',{class:'score-badge'});
  top.appendChild(progress); top.appendChild(scoreBadge);
  panel.appendChild(top);
  const qText = el('p',{style:'font-size:28px; font-weight:600; margin:16px 0;'});
  panel.appendChild(qText);
  const optRow = el('div',{class:'btn-row'});
  panel.appendChild(optRow);
  const fb = feedbackBox();
  panel.appendChild(fb);
  container.appendChild(panel);

  function updateTop(){
    progress.textContent = 'Question '+(idx+1)+' of '+questions.length;
    scoreBadge.textContent = 'Score: '+score+'/'+questions.length;
  }

  function renderQ(){
    updateTop();
    const c = questions[idx];
    qText.textContent = c.q;
    optRow.innerHTML=''; fb.className='feedback'; answered=false;
    c.options.forEach((opt,oi)=>{
      const b = el('button',{class:'btn big'}, opt);
      b.addEventListener('click',()=>{
        if(answered) return; answered=true;
        const correct = oi===c.answer;
        if(correct) score++;
        updateTop();
        showFeedback(fb, correct, '<b>'+(correct?'CORRECT.':'TRY AGAIN \u2014')+'</b> '+c.explain);
        [...optRow.children].forEach((btn,bi)=>{ btn.disabled=true; if(bi===c.answer) btn.classList.add('correct'); else if(bi===oi) btn.classList.add('wrong'); });
        const nextRow = el('div',{class:'continue-row mt'});
        const label = idx<questions.length-1 ? 'Next Question \u2192' : 'See Final Score \u2192';
        nextRow.appendChild(el('button',{class:'btn primary big', onclick:()=>{
          nextRow.remove();
          if(idx<questions.length-1){ idx++; renderQ(); } else { showFinal(); }
        }}, label));
        panel.appendChild(nextRow);
      });
      optRow.appendChild(b);
    });
  }

  function showFinal(){
    qText.textContent = '';
    optRow.innerHTML='';
    fb.className='feedback show good';
    fb.innerHTML = '<b>Quiz complete.</b> You scored '+score+' out of '+questions.length+'.';
    markComplete(8);
    const row = el('div',{class:'continue-row mt'});
    row.appendChild(el('button',{class:'btn ghost big', onclick:()=>{ idx=0; score=0; renderQ(); }},'Retake Quiz'));
    row.appendChild(el('button',{class:'btn primary big', onclick:()=>goNext()},'Continue to Concept Map \u2192'));
    panel.appendChild(row);
  }

  renderQ();
  return { restart(){ renderScreen(); },
    showAnswer(){ if(answered) return; const c=questions[idx]; [...optRow.children].forEach((btn,bi)=>{btn.disabled=true; if(bi===c.answer) btn.classList.add('correct');}); showFeedback(fb,true,'<b>Answer:</b> '+c.explain); answered=true; },
    resetQuestion(){ renderQ(); },
    discussion:['Why did you choose this answer?'] };
}

/* ---- Screen 9: Concept map ---- */
function buildScreen9(container){
  container.appendChild(screenHeader('Screen 10 \u00b7 Final Concept Map','Putting it all together',''));
  const panel = el('div',{class:'panel'});
  const steps = ['SOLUTE','CHEMICAL NATURE / POLARITY','INTERMOLECULAR INTERACTIONS','SOLUTE\u2013SOLVENT COMPATIBILITY','DISSOLUTION'];
  const flow = el('div',{class:'flow'});
  steps.forEach((s,i)=>{
    flow.appendChild(el('div',{class:'flow-node', style:'animation-delay:'+(i*0.15)+'s;'}, s));
    if(i<steps.length-1) flow.appendChild(el('div',{class:'flow-arrow', style:'animation-delay:'+(i*0.15+0.08)+'s;'}, '\u2193'));
  });
  panel.appendChild(flow);
  panel.appendChild(el('div',{class:'takeaway', style:'animation-delay:'+(steps.length*0.15)+'s;'},'LIKE DISSOLVES LIKE'));
  panel.appendChild(el('div',{class:'takeaway-sub', style:'animation-delay:'+(steps.length*0.15+0.3)+'s;'},'Favorable solute\u2013solvent interactions promote dissolution.'));
  const row = el('div',{class:'continue-row mt'});
  row.appendChild(el('button',{class:'btn primary big', onclick:()=>{
    state.completed = new Array(10).fill(false);
    goTo(0);
  }},'RESTART MODULE'));
  panel.appendChild(row);
  container.appendChild(panel);
  markComplete(9);
  return { restart(){ renderScreen(); }, showAnswer(){}, resetQuestion(){}, discussion:['What is the single most important takeaway from this module?'] };
}

const BUILDERS = [buildScreen0,buildScreen1,buildScreen2,buildScreen3,buildScreen4,buildScreen5,buildScreen6,buildScreen7,buildScreen8,buildScreen9];

/* ===================== RENDER LOOP ===================== */
function renderScreen(){
  stage.innerHTML = '';
  stage.scrollTop = 0;
  tJump.value = state.screen;
  discussionPop.classList.remove('show');
  currentHooks = BUILDERS[state.screen](stage) || {restart:null,showAnswer:null,resetQuestion:null,discussion:[]};
  renderDots();
  stage.classList.remove('screen-enter');
  void stage.offsetWidth; /* restart animation */
  stage.classList.add('screen-enter');
  stage.focus({preventScroll:true});
}

/* ===== 16:9 kiosk frame scaling ===== */
const frame = document.getElementById('frame');
function fitFrame(){
  const vw = window.innerWidth, vh = window.innerHeight;
  const scale = Math.min(vw/1920, vh/1080);
  const tx = (vw - 1920*scale)/2;
  const ty = (vh - 1080*scale)/2;
  frame.style.transform = 'translate('+tx+'px,'+ty+'px) scale('+scale+')';
}
window.addEventListener('resize', fitFrame);
fitFrame();

renderScreen();
})();
</script>
